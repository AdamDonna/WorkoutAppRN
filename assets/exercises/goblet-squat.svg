<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="400" fill="#f8f9fa"/>
  
  <!-- Floor -->
  <rect x="0" y="380" width="300" height="20" fill="#e9ecef"/>
  
  <!-- Kettlebell -->
  <circle cx="150" cy="180" r="25" fill="#2c2c2c"/>
  <rect x="125" y="155" width="50" height="15" rx="7" fill="#495057"/>
  
  <!-- Figure -->
  <!-- Head -->
  <circle cx="150" cy="80" r="20" fill="#fdbcb4"/>
  
  <!-- Torso -->
  <rect x="135" y="100" width="30" height="60" rx="15" fill="#007bff"/>
  
  <!-- Arms -->
  <rect x="120" y="110" width="15" height="40" rx="7" fill="#fdbcb4" transform="rotate(-20 127.5 130)"/>
  <rect x="165" y="110" width="15" height="40" rx="7" fill="#fdbcb4" transform="rotate(20 172.5 130)"/>
  
  <!-- Hands holding kettlebell -->
  <circle cx="135" cy="155" r="8" fill="#fdbcb4"/>
  <circle cx="165" cy="155" r="8" fill="#fdbcb4"/>
  
  <!-- Legs in squat position -->
  <rect x="125" y="160" width="15" height="45" rx="7" fill="#fdbcb4" transform="rotate(-15 132.5 182.5)"/>
  <rect x="160" y="160" width="15" height="45" rx="7" fill="#fdbcb4" transform="rotate(15 167.5 182.5)"/>
  
  <!-- Lower legs -->
  <rect x="115" y="200" width="15" height="35" rx="7" fill="#fdbcb4" transform="rotate(-5 122.5 217.5)"/>
  <rect x="170" y="200" width="15" height="35" rx="7" fill="#fdbcb4" transform="rotate(5 177.5 217.5)"/>
  
  <!-- Feet -->
  <ellipse cx="115" cy="240" rx="15" ry="8" fill="#2c2c2c"/>
  <ellipse cx="185" cy="240" rx="15" ry="8" fill="#2c2c2c"/>
  
  <!-- Movement arrows -->
  <path d="M200 200 L200 230 L195 225 M200 230 L205 225" stroke="#28a745" stroke-width="2" fill="none"/>
  <text x="210" y="220" fill="#28a745" font-family="Arial, sans-serif" font-size="12">Down</text>
  
  <path d="M80 200 L80 170 L75 175 M80 170 L85 175" stroke="#007bff" stroke-width="2" fill="none"/>
  <text x="45" y="180" fill="#007bff" font-family="Arial, sans-serif" font-size="12">Up</text>
  
  <!-- Title -->
  <text x="150" y="30" text-anchor="middle" fill="#2c2c2c" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Goblet Squat</text>
  
  <!-- Instructions -->
  <text x="150" y="320" text-anchor="middle" fill="#6c757d" font-family="Arial, sans-serif" font-size="12">Hold kettlebell close to chest</text>
  <text x="150" y="335" text-anchor="middle" fill="#6c757d" font-family="Arial, sans-serif" font-size="12">Squat down keeping chest up</text>
  <text x="150" y="350" text-anchor="middle" fill="#6c757d" font-family="Arial, sans-serif" font-size="12">Return to standing position</text>
</svg>